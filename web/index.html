<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>工程注记编辑器</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="title">工程注记编辑器</span>
  <span id="meta"></span>
</header>
<div id="toolbar"></div>
<main>
  <section id="left">
    <div class="panel-title">矢量编辑区（拖动注记移动；直线/矩形用拖拽绘制）</div>
    <canvas id="vector"></canvas>
  </section>
  <section id="right">
    <div class="panel-title">栅格结果区（设备像素）<span id="result-scale"></span></div>
    <div id="result-wrap"><canvas id="result"></canvas></div>
    <div class="panel-title">单字覆盖 / 采样位置</div>
    <div id="glyph-panel">
      <canvas id="glyph" width="220" height="220"></canvas>
      <div id="glyph-info"></div>
    </div>
    <div id="samples"></div>
    <div class="panel-title">内核反馈</div>
    <div id="errors"></div>
  </section>
</main>
<script src="/editor.js"></script>
</body>
</html>
